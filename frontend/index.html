<!doctype html>
<html lang="bn" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SylhetyTutor — Verified University Home Tutors in Sylhet</title>
    <meta name="description" content="Connect with verified university student tutors in Sylhet from SUST, Metropolitan, and Leading University. Safe, trusted home tutoring for school and college students." />

    <!-- Google Fonts: Plus Jakarta Sans & Hind Siliguri -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />

    <!-- Zero-flash theme initialization -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("sylhetytutor_theme") || "system";
          if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-fg min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
