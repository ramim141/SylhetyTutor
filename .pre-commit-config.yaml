# Runs on every `git commit`. One-time setup: pip install pre-commit && pre-commit install
# Run on everything manually: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (frontend)
        entry: npm --prefix frontend run lint --silent
        language: system
        files: ^frontend/src/.*\.(js|jsx)$
        pass_filenames: false
